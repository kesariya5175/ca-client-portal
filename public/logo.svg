<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer C arc (navy) -->
  <path d="M100 60 A42 42 0 1 1 85 22" stroke="#0f2557" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Document stack - back (teal dark) -->
  <rect x="62" y="18" width="30" height="38" rx="4" fill="#0d5c63"/>
  <!-- Document stack - front (teal) -->
  <rect x="56" y="26" width="30" height="38" rx="4" fill="#0e9280"/>
  <!-- Document lines -->
  <rect x="62" y="34" width="18" height="2.5" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="62" y="40" width="14" height="2.5" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="62" y="46" width="16" height="2.5" rx="1" fill="rgba(255,255,255,0.35)"/>

  <!-- Small card bottom right -->
  <rect x="70" y="56" width="22" height="16" rx="3" fill="#0f2557" opacity="0.85"/>
  <circle cx="74" cy="62" r="2.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="78" y="60" width="10" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="78" y="64" width="7" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

  <!-- Padlock body (white) -->
  <rect x="44" y="52" width="24" height="20" rx="4" fill="white"/>
  <!-- Padlock shackle -->
  <path d="M50 52 L50 45 Q56 39 62 45 L62 52" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Keyhole -->
  <circle cx="56" cy="60" r="3" fill="#0e9280"/>
  <rect x="54.5" y="61" width="3" height="5" rx="1" fill="#0e9280"/>
</svg>
